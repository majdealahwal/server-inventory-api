name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: pytest -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the API
        env:
          APP_VERSION: ci-${{ github.run_number }}
        run: |
          python app.py &
          sleep 5

      - name: Check /healthz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz)
          echo "Got status code: $code"
          test "$code" = "200"

      - name: Check /readyz
        run: |
          response=$(curl -s http://127.0.0.1:5000/readyz)
          echo "Response: $response"
          echo "$response" | grep -q '"servers_loaded":9'

      - name: Check /version
        run: |
          response=$(curl -s http://127.0.0.1:5000/version)
          echo "Response: $response"
          echo "$response" | grep -q "ci-${{ github.run_number }}"
